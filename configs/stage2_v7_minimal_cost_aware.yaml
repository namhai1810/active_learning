extends: stage2_v7_early_stopping_verification_on.yaml

# Preserve the proven V7 ON flow and training policy. Round 1 is mandatory;
# only rounds 2-8 receive the mixed-policy Cost-Aware decision gate.
closed_loop:
  total_budget: 256
  max_rounds: 8
  per_round_examples: 32
  final_hypothesis_audit: true

# Seven refresh/decision rounds (2-8), one final audit, and one reserved family.
# Adaptive verification still has its inherited two-look [20, 30] schedule.
verification:
  max_rounds: 9

cost_aware:
  enabled: true
  protocol_version: v7_m32_marginal_continue_cost_v2
  decision_cost_semantics: marginal_incremental_cost_if_continue_after_pilots
  decision_scope: exact_v7_mixed_soft_pair_round_action
  start_round: 2

  # Thirty-two independent pilot training randomizations use one fixed,
  # predeclared 64-example shard per round. Shared evaluation examples are not
  # counted as independent observations; the pilot run is the Hoeffding unit.
  required_pilots: 32
  pilot_eval_size: 64
  shared_eval_shard_within_round: true
  pilot_seed: 42
  preserve_pilot_adapters: false

  # The mixed selector is one policy action, hence K=1 and T=7 decisions.
  # Gain is binary validation-risk reduction in [-1, 1].
  M: 1.0
  delta: 0.05
  K: 1
  T: 7

  # Ex-ante utility calibration, independent of seed/model/final-test results:
  # a full 1.0 reduction in binary validation risk is worth at most USD 5.
  # Therefore lambda = 1.0 / 5.0 = 0.2 gain units per USD.
  calibration_reference_gain: 1.0
  calibration_reference_cost: 5.0
  calibration_currency: USD
  lambda_cost: 0.2
  cost:
    type: full_pipeline
    currency: USD
    rates:
      llm_input_per_1k_tokens: 0.0002
      llm_output_per_1k_tokens: 0.0006
      data_generation_per_item: 0.001
      data_verification_per_item: 0.001
      lora_training_per_run: 0.02
      lora_training_per_gpu_hour: 0.5
      evaluation_per_run: 0.005
      evaluation_per_item: 0.0001
      evaluation_per_gpu_hour: 0.5
    projections:
      lora_training_gpu_seconds_fixed: 0.0
      lora_training_gpu_seconds_per_item: 0.2
      evaluation_gpu_seconds_fixed: 0.0
      evaluation_gpu_seconds_per_item: 0.02
