extends: main_common.yaml

pilot:
  m: 4
  pilot_train_size: 32
  gain_eval_size: 64
  seed: 42
  applicability_seed: 42
  max_records_per_call: 50
  prompt_version: hypothesis_operationalization_v1
  preserve_adapters: true

gain:
  M: 1.0
  delta: 0.05
  K: 5
  # Family-wise accounting horizon. Standalone one-round runs still use the
  # complete gain_eval split; the multi-round runner overrides current_round.
  T: 5
  tolerance: 1.0e-12
