extends: main_verification.yaml

# This profile is for an isolated ours_verified development run. K=3 and T=1
# match the actual one-shot search performed by verify_hypotheses.py; they are
# not relaxed after observing outcomes. Sixty requested sets leave headroom for
# fail-closed QC while retaining the original 40-valid-set reliability floor.
verification:
  n_probe_sets: 60
  min_valid_probe_sets: 40
  max_hypotheses_per_round: 3
  max_rounds: 1
  probe_prompt_version: controlled_verification_probes_v4
