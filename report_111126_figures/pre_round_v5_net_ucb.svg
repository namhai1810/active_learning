<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Pre-Round Stopping v5 Net-UCB</title>
  <desc id="desc">Net-UCB remains positive for seeds 42 and 43 before rounds 2 through 8, therefore no certified stop occurs.</desc>
