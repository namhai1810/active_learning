mode: llm_main
oracle_debug: false
hans:
  name: hans
  data_file: https://raw.githubusercontent.com/tommccoy1/hans/7299f6f657089ce06a0f98e7e81f8d0f5b7741ce/heuristics_evaluation_set.txt
  split: validation
  cache_dir: null
  max_examples: null
  discovery_fraction: 0.125
  verification_fraction: 0.125
  intervention_fraction: 0.125
  gain_eval_fraction: 0.125
  split_seed: 20261011
teacher:
  provider: huggingface
  name_or_path: Qwen/Qwen3-14B
  device_map: auto
  dtype: bfloat16
  trust_remote_code: false
  local_files_only: false
  max_input_tokens: 8192
