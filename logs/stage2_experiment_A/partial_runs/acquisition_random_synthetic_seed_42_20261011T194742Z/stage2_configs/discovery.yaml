model:
  name_or_path: Qwen/Qwen3-1.7B
  adapter_path: null
  device_map: cuda:0
  dtype: float32
  trust_remote_code: false
  local_files_only: false
  max_length: 512
  batch_size: 16
training:
  num_epochs: 1
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-05
